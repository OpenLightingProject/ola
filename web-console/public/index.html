<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMX Web Console</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">DMX Web Console</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav nav-tabs border-0" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active bg-transparent border-0 text-white" id="faders-tab" data-bs-toggle="tab" data-bs-target="#faders" type="button" role="tab" aria-controls="faders" aria-selected="true">Faders</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link bg-transparent border-0 text-white-50" id="scenes-tab" data-bs-toggle="tab" data-bs-target="#scenes" type="button" role="tab" aria-controls="scenes" aria-selected="false">Scenes</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link bg-transparent border-0 text-white-50" id="chases-tab" data-bs-toggle="tab" data-bs-target="#chases" type="button" role="tab" aria-controls="chases" aria-selected="false">Chases</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link bg-transparent border-0 text-white-50" id="cuelist-tab" data-bs-toggle="tab" data-bs-target="#cuelist" type="button" role="tab" aria-controls="cuelist" aria-selected="false">Cues</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link bg-transparent border-0 text-white-50" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab" aria-controls="settings" aria-selected="false">Settings</button>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 tab-content">

    <!-- Faders Tab -->
    <div id="faders" class="tab-pane fade show active" role="tabpanel" aria-labelledby="faders-tab">
        <h3>Faders</h3>
        <div class="row mb-3">
            <div class="col-md-4">
                <label for="universeSelect" class="form-label">Universe</label>
                <select id="universeSelect" class="form-select">
                    <option value="0">Universe 1</option>
                    <option value="1">Universe 2</option>
                    <option value="2">Universe 3</option>
                    <option value="3">Universe 4</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="pageSelect" class="form-label">Page (Channels)</label>
                <select id="pageSelect" class="form-select">
                    <!-- Pages populated by JS -->
                </select>
            </div>
        </div>

        <div class="fader-container d-flex justify-content-around flex-wrap" id="faderRow">
            <!-- 12 Faders generated by JS -->
        </div>

        <hr>
        <button class="btn btn-success" id="btnSaveScene">Save current state as Scene</button>
    </div>

    <!-- Scenes Tab -->
    <div id="scenes" class="tab-pane fade" role="tabpanel" aria-labelledby="scenes-tab">
        <h3>Scenes</h3>
        <ul class="list-group" id="sceneList">
            <!-- Scenes generated by JS -->
        </ul>
    </div>

    <!-- Chases Tab -->
    <div id="chases" class="tab-pane fade" role="tabpanel" aria-labelledby="chases-tab">
        <h3>Chases</h3>
        <button class="btn btn-primary mb-3" id="btnNewChase">Create New Chase</button>
        <ul class="list-group" id="chaseList">
            <!-- Chases generated by JS -->
        </ul>
    </div>

    <!-- Cuelist Tab -->
    <div id="cuelist" class="tab-pane fade" role="tabpanel" aria-labelledby="cuelist-tab">
        <div class="row justify-content-center">
            <div class="col-md-6 cue-panel">
                <h3 class="text-center mb-4">Gestion de la Liste de Cues</h3>

                <!-- Form to add cues -->
                <div class="card bg-secondary mb-4">
                    <div class="card-body">
                        <select id="cueSceneSelect" class="form-select mb-3 bg-dark text-white border-secondary">
                            <!-- Populated by JS -->
                        </select>
                        <div class="input-group mb-3">
                            <input type="number" id="cueFadeTime" class="form-control bg-dark text-white border-secondary" placeholder="0.5" value="0.5" step="0.1" min="0">
                            <span class="input-group-text bg-dark text-white border-secondary">s</span>
                        </div>
                        <button class="btn btn-primary w-100" id="btnAddCue">Ajouter à la liste</button>
                    </div>
                </div>

                <!-- Cuelist table -->
                <div class="card bg-secondary mb-4">
                    <div class="card-header border-secondary">
                        <h4 class="mb-0">Liste des Cues</h4>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark table-striped mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>NOM DU CUE</th>
                                    <th>TEMPS (S)</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="cuelistTableBody">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Global Controls -->
                <button class="btn btn-success w-100 btn-cue-control mb-2" id="btnCueGo">GO</button>
                <button class="btn btn-warning w-100 btn-cue-control mb-2" id="btnCuePause">PAUSE</button>
                <button class="btn btn-danger w-100 btn-cue-control mb-2" id="btnCueStop">STOP</button>
                <button class="btn btn-secondary w-100 btn-cue-control mt-3" onclick="document.querySelector('.nav-link[href=\'#faders\']').click()">Retour à l'accueil</button>
            </div>
        </div>
    </div>

    <!-- Settings Tab -->
    <div id="settings" class="tab-pane fade" role="tabpanel" aria-labelledby="settings-tab">
        <h3>Settings</h3>
        <div class="mb-3">
            <label for="modeSelect" class="form-label">Operating Mode</label>
            <select id="modeSelect" class="form-select">
                <option value="standalone">Standalone (Web console controls output)</option>
                <option value="artnet">Art-Net Node (External controller via Art-Net)</option>
            </select>
        </div>
        <button class="btn btn-primary" id="btnSaveSettings">Save Settings</button>
    </div>

</div>

<!-- Modal for New Scene -->
<div class="modal fade" id="newSceneModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Save Scene</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="sceneNameInput" class="form-control" placeholder="Scene Name">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="btnConfirmSaveScene">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal for New Chase -->
<div class="modal fade" id="newChaseModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Chase</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="chaseNameInput" class="form-control mb-3" placeholder="Chase Name">
        <h6>Steps</h6>
        <div id="chaseStepsContainer"></div>
        <button class="btn btn-sm btn-outline-primary mt-2" id="btnAddStep">Add Step</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="btnConfirmSaveChase">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
